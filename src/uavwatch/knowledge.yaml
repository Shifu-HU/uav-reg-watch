# 无人机飞行常识知识库
# 用途：晨报「飞行常识」板块 —— 这些是不需要搜索的稳定法规常识，
# 每次晨报固定输出，避免新手每次都去翻原文。
# 修改后无需重启：下次生成晨报时自动读取。

# ---------------------------------------------------------------
# 一、高度限制（最常问）
# ---------------------------------------------------------------
- id: height-120
  category: 高度
  title: 真高 120 米是硬上限
  level: 常识
  short: 微型/轻型/小型无人机在适飞空域内，真高不得超过 120 米。
  detail: |
    《无人驾驶航空器飞行管理暂行条例》规定，微型、轻型、小型无人驾驶航空器
    在适飞空域内飞行，真高（距地实际高度，不是海拔）不得超过 120 米。
    超过 120 米即属于管制空域范畴，需提前申请。
  why: 真高 120 米是绝大多数飞手唯一需要记住的数字，超限即违规。
  keywords: [120米, 真高, 高度, 超限, 限高]

- id: height-airport
  category: 高度
  title: 机场周边另有更低限制
  level: 常识
  short: 机场净空保护区内高度限制远低于 120 米，且禁飞范围以机场公告为准。
  detail: |
    机场障碍物限制面保护范围内，飞行高度受严格限制甚至完全禁止。
    具体范围以民航局公布的各机场障碍物限制面保护范围公告为准。
  why: 很多飞手以为"只要不超 120 米就行"，忽略了机场周边的特殊限制。
  keywords: [机场, 净空, 障碍物限制面, 净空保护区]

# ---------------------------------------------------------------
# 二、空域划分
# ---------------------------------------------------------------
- id: airspace-suitable
  category: 空域
  title: 适飞空域 vs 管制空域
  level: 常识
  short: 适飞空域内飞行无需申请；管制空域必须提前申请获批。
  detail: |
    适飞空域：真高 120 米以下的空域（机场、军事禁区等特殊区域除外）。
    管制空域：机场净空区、军事管理区、重要设施、城市核心区等。
    在管制空域飞行必须提前向空管部门申请，获批后方可飞行。
  why: 分不清这两类空域是新手被处罚的最主要原因。
  keywords: [适飞空域, 管制空域, 空域申请, 申请空域]

- id: airspace-shenzhen
  category: 空域
  title: 深圳常见需要避让的区域
  level: 地区
  short: 深圳宝安机场净空区、福田/南山中心区、各口岸与边防区域需特别留意。
  detail: |
    深圳地区飞行前建议确认：
      · 深圳宝安国际机场净空保护区（含西乡、福永、沙井一带）
      · 福田中心区、南山后海等高层密集区的管控要求
      · 各口岸（福田口岸、深圳湾口岸、皇岗口岸）及边境沿线
      · 大疆等厂商固件内置的禁飞区数据库（建议起飞前同步更新）
  why: 深圳城区密度高、机场近，是无人机管控最严格的城市之一。
  keywords: [深圳, 宝安机场, 福田, 南山, 口岸, 边防]

# ---------------------------------------------------------------
# 三、实名与资质
# ---------------------------------------------------------------
- id: reg-realname
  category: 登记
  title: 实名登记是强制的
  level: 常识
  short: 除微型以下外，所有无人机必须实名登记，并在机身粘贴登记标志。
  detail: |
    民用无人驾驶航空器所有者应当依法进行实名登记。
    登记后需将登记标志粘贴在机身显著位置，飞行时随身携带相关证件。
    未实名登记的，可处 200 元以下罚款；情节严重的从重处罚。
  why: 实名登记是成本最低、也最容易被忽略的合规动作。
  keywords: [实名登记, 登记标志, 登记, UOM, 民航局]

- id: reg-license
  category: 资质
  title: 什么时候需要执照
  level: 常识
  short: 微型/轻型在适飞空域内飞行无需执照；小型及以上、或管制空域作业需持证。
  detail: |
    微型（<0.25kg）、轻型（0.25-4kg）在适飞空域内飞行，无需驾驶员执照。
    小型（4-15kg）、中型、大型，或从事经营性作业的，需取得相应执照。
    执照类别需覆盖实际机型与作业场景。
  why: 很多人不知道自己是否需要考证，这里一句话说清边界。
  keywords: [执照, CAAC, 驾驶员, 资质, 考证, 微型, 轻型, 小型]

# ---------------------------------------------------------------
# 四、飞行前检查
# ---------------------------------------------------------------
- id: preflight
  category: 操作
  title: 起飞前的五步检查
  level: 常识
  short: 查空域 → 查禁飞 → 查天气 → 查电量 → 查返航点。
  detail: |
    1. 查空域：确认当前位置属于适飞空域，或已获批管制空域飞行许可
    2. 查禁飞：确认没有新增临时禁飞通告（本晨报会提示）
    3. 查天气：风速、降水、能见度是否满足机型要求
    4. 查电量：电池与遥控器电量、桨叶是否完好
    5. 查返航点：GPS 信号良好、返航高度设置正确
  why: 把检查清单固化下来，能避免绝大多数"飞出去回不来"的事故。
  keywords: [飞行前, 检查, 清单, 返航, GPS, 电量]

- id: night-flight
  category: 操作
  title: 夜间飞行的额外要求
  level: 常识
  short: 夜间飞行需开启航行灯，且须在视距内、具备相应资质。
  detail: |
    夜间飞行（日落后至日出前）应开启航行灯，保持目视视距内飞行。
    部分场景需提前报备。城市区域夜间飞行往往还有地方性限制。
  why: 夜间事故率高，且不少城市对夜间飞行有额外规定。
  keywords: [夜间, 航行灯, 视距, 夜飞]

# ---------------------------------------------------------------
# 五、违规后果
# ---------------------------------------------------------------
- id: penalty
  category: 处罚
  title: 常见违规与处罚尺度
  level: 常识
  short: 未实名登记罚 200 元以下；违规飞行可处 1000 元至 2 万元；情节严重的可没收。
  detail: |
    未实名登记：200 元以下罚款。
    未经批准在管制空域飞行：500 元以上 1000 元以下罚款。
    违规飞行造成后果：1000 元至 2 万元罚款，情节严重可没收无人机。
    危害公共安全或扰乱秩序：可能承担治安管理处罚甚至刑事责任。
  why: 知道处罚尺度，才能判断哪些红线绝对不能碰。
  keywords: [处罚, 罚款, 违规, 没收, 治安]

# ---------------------------------------------------------------
# 六、隐私与拍摄
# ---------------------------------------------------------------
- id: privacy
  category: 拍摄
  title: 拍摄他人与敏感区域
  level: 常识
  short: 不得拍摄他人隐私、军事设施、涉密单位；航拍素材公开发布前需审核。
  detail: |
    未经允许拍摄他人住宅、私密活动可能侵犯隐私权。
    军事设施、涉密单位、国家机关等属于禁止拍摄范围。
    航拍素材若包含敏感内容，公开发布前应做审核去密处理。
  why: 航拍带来的隐私与涉密风险，是飞手容易忽略的法律风险。
  keywords: [隐私, 拍摄, 涉密, 军事, 航拍]

# ---------------------------------------------------------------
# 七、设备与保险
# ---------------------------------------------------------------
- id: insurance
  category: 设备
  title: 第三方责任险
  level: 建议
  short: 经营性飞行建议投保第三者责任险；部分作业场景为强制要求。
  detail: |
    从事经营性通用航空飞行活动的，应当投保地面第三者责任险。
    个人娱乐飞行虽非强制，但投保能显著降低意外事故的经济风险。
  why: 一次坠机伤人可能是几十万的赔偿，保险成本极低。
  keywords: [保险, 责任险, 第三方, 经营]

- id: firmware
  category: 设备
  title: 固件禁飞区数据库要更新
  level: 建议
  short: 起飞前同步厂商固件里的禁飞区数据，避免飞到"地图上是空白、实际禁飞"的区域。
  detail: |
    大疆等厂商在固件内置了禁飞区/限飞区数据库，并会随管控要求更新。
    临时禁飞（如大型活动安保）往往先更新到厂商数据库。
    建议联网状态下每次飞行前同步一次。
  why: 厂商数据库更新通常比新闻报道更及时，是临时禁飞的第一道提醒。
  keywords: [固件, 禁飞区, 数据库, 大疆, 更新]
