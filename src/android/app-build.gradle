plugins {
    id "com.android.application"
    id "com.chaquo.python"
}

android {
    namespace "com.shifu.uavmobile"
    compileSdk 34
    defaultConfig {
        applicationId "com.shifu.uavmobile"
        minSdk 24
        targetSdk 28
        versionCode 20
        versionName "2.0"
        ndk { abiFilters "x86_64", "arm64-v8a" }
        python {
            buildPython "C:/Users/Shifu_HU/AppData/Local/Programs/Python/Python311/python.exe"
            pip {
                install "fastapi"
                install "pydantic<2"
                install "uvicorn"
                install "httpx"
                install "beautifulsoup4"
                install "pyyaml"
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes { release { minifyEnabled false } }
}

dependencies {
    implementation "androidx.appcompat:appcompat:1.6.1"
}